<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>太阳系 · Solar System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Full-screen WebGL canvas */
  #globe {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  .hint {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.55);
    font-size: 13px;
    letter-spacing: .5px;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.12);
    padding: 8px 16px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
    pointer-events: none;
    user-select: none;
    z-index: 10;
    white-space: nowrap;
  }

  #loader {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: rgba(255,255,255,.8); font-size: 14px;
    z-index: 20; transition: opacity .4s ease;
    letter-spacing: 1px;
  }
  #loader.done { opacity: 0; pointer-events: none; }

  /* Top-right toggle */
  .toggle {
    position: fixed; top: 18px; right: 16px; z-index: 10;
    display: flex; align-items: center; gap: 7px;
    color: rgba(255,255,255,.72); font-size: 12.5px;
    background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.14);
    padding: 6px 13px; border-radius: 20px; backdrop-filter: blur(7px);
    cursor: pointer; user-select: none;
  }
</style>
</head>
<body>
  <canvas id="globe"></canvas>

  <!-- Loading overlay -->
  <div id="loader">正在构建太阳系…</div>

  <!-- Auto-rotate toggle -->
  <label class="toggle" for="autorotate">
    <input type="checkbox" id="autorotate" checked />
    公转动画
  </label>

  <!-- Hint -->
  <footer class="hint">拖拽旋转视角 · 滚轮缩放</footer>

  <!-- Local vendored libs (no CDN, offline-capable) -->
  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/OrbitControls.js"></script>
  <!-- App -->
  <script src="main.js"></script>
</body>
</html>
